# =============================================================================
#  GitHub Actions —— 从仓库内 Dockerfile 构建多架构 Docker 镜像并推送到 Docker Hub
# =============================================================================
#
#  【一次性准备】GitHub 仓库 → Settings → Secrets and variables → Actions：
#    DOCKERHUB_USERNAME = 你的 Docker Hub 用户名（例如 hazaki）
#    DOCKERHUB_TOKEN    = Docker Hub Access Token（不要用登录密码，
#                         在 https://hub.docker.com/settings/security 生成）
#
#  【触发方式】
#    - push 到 main/master            -> 构建并推送（打上分支名 + latest + sha 标签）
#    - push 形如 v1.2.3 的 tag        -> 构建并推送（打上 1.2.3 / 1.2 / 1 / latest）
#    - Pull Request                   -> 只构建验证，不推送
#    - 手动触发 (Actions 页面 Run)    -> 可勾选是否推送、可指定自定义 tag
#
#  【常改的地方】都在下面的 env: 和 platforms: 两处
# =============================================================================

name: Build and Push Docker Image

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
    # 只有这些文件变动才触发构建，避免改 README 也跑一遍。
    # 注意：如果你的 Dockerfile 在子目录，记得把路径改掉。
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'entrypoint.sh'
      - '.github/workflows/docker-build.yml'

  pull_request:
    branches: [main, master]

  workflow_dispatch:
    inputs:
      push:
        description: '构建完成后是否推送到镜像仓库'
        type: boolean
        default: false
      tag:
        description: '自定义镜像 tag（留空则按默认规则自动生成）'
        type: string
        required: false

env:
  # ---- 目标镜像名 ----------------------------------------------------------
  # 默认取 GitHub 的 <owner>/<repo>，即仓库 hazaki/msd -> 镜像 hazaki/msd。
  # 若 Docker Hub 用户名 != GitHub owner，请写死，例如：docker.io/hazaki/msd
  IMAGE_NAME: docker.io/${{ github.repository }}

  # ---- Dockerfile 位置与构建上下文 ----------------------------------------
  DOCKERFILE_PATH: ./Dockerfile
  BUILD_CONTEXT: .

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # semver 标签推断需要完整 tag 历史，不要改成浅克隆
          fetch-depth: 0
          # 若构建依赖 git submodule，把下一行取消注释
          # submodules: recursive

      # 多架构构建需要 QEMU 来模拟非 amd64 指令
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # PR 不推送，手动触发时看 push 开关
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' || inputs.push)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # 分支名，如 main
            type=ref,event=branch
            # git tag v1.2.3 -> 1.2.3 / 1.2 / 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 默认分支固定再打一个 latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 每次提交都给一个 sha-xxxxxxx，便于回溯
            type=sha,prefix=sha-,format=short
            # 手动触发时传入的自定义 tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          # ---- 目标架构：按需增删 ----------------------------------------
          # 常见的 IPTV/组播镜像一般跑在 amd64 服务器 + 部分 ARM 软路由/NAS 上，
          # 用不到 arm/v7 就删掉它，能省一大截构建时间。
          platforms: linux/amd64,linux/arm64
          push: >-
            ${{ github.event_name != 'pull_request' &&
                (github.event_name != 'workflow_dispatch' || inputs.push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 关掉 provenance attestation，让 manifest 保持干净的纯多架构列表
          provenance: false
          # GitHub Actions 缓存，二次构建提速明显
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        if: always()
        run: |
          {
            echo "### 🐳 镜像构建结果"
            echo ""
            echo "- **仓库镜像**：\`${{ env.IMAGE_NAME }}\`"
            echo "- **触发方式**：${{ github.event_name }}"
            echo "- **是否推送**：${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}"
            echo ""
            echo "**本次生成标签：**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
